<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Memo Widget</title>
<style>
    :root {
        --scale: 1; /* S, M, L 비율 계수 */
        --primary-color: #6366f1;
        --bg-color: #ffffff; /* 위젯 본체 색상 */
        --memo-bg: #f3f4f6;
        --text-color: #1f2937;
        --border-color: #e5e7eb;
        --widget-shadow: 0 0.3em 1em rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 1. 위젯 밖쪽 가장자리 배경은 항상 투명하게 뚫어둠 */
    html, body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: transparent !important;
        margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    }

    /* 3. 완벽한 노션 드래그 대응 반응형 래퍼 (vmin 단위 활용) */
    .scale-wrapper {
        font-size: calc(clamp(11px, 4.5vmin, 20px) * var(--scale));
        width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
        padding: 1.5em; /* 둥근 모서리와 그림자 보존 여백 */
    }

    body.embed-mode .scale-wrapper {
        font-size: calc(clamp(10px, 4.5vmin, 24px) * var(--scale));
    }

    /* 위젯 본체 (둥근 네모 모양 완벽 유지) */
    .widget-container {
        width: 100%; max-width: 28em; height: 100%;
        background-color: var(--bg-color); 
        border-radius: 1.5em; /* 노션 왼쪽 둥근 모서리 디자인 */
        padding: 1.8em; display: flex; flex-direction: column;
        box-shadow: var(--widget-shadow); position: relative; overflow: hidden;
    }

    body.embed-mode .widget-container { max-width: 100%; }

    .header { font-size: 1.6em; font-weight: 900; color: var(--text-color); margin-bottom: 1em; letter-spacing: -0.02em; word-break: break-all; }

    .input-section { margin-bottom: 1.2em; }
    .input-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 0.8em; }
    
    .input-wrapper input {
        width: 100%; padding: 0.8em 3em 0.8em 1em; border: none; border-radius: 4em;
        background-color: var(--memo-bg); font-size: 1em; outline: none; color: var(--text-color);
    }
    .input-wrapper input::placeholder { color: #9ca3af; }

    /* 아이콘들을 1px 오차 없이 중앙에 정렬 */
    .center-icon {
        display: flex; justify-content: center; align-items: center; 
        line-height: 0 !important; padding: 0 !important; margin: 0;
    }

    .add-btn {
        position: absolute; right: 0.5em; width: 2em; height: 2em; border-radius: 50%;
        background-color: var(--primary-color); color: white; border: none; 
        font-size: 1.2em; cursor: pointer; transition: transform 0.1s;
    }
    .add-btn:active { transform: scale(0.95); }

    /* 색상 버튼들 크기 및 비율 */
    .color-picker { display: flex; gap: 0.4em; padding: 0 0.8em; }
    .color-circle {
        width: 0.9em; height: 0.9em; border-radius: 50%; cursor: pointer;
        border: max(1px, 0.08em) solid transparent; transition: transform 0.2s;
    }
    .color-circle.active { border: max(2px, 0.15em) solid #1f2937; transform: scale(1.15); }
    
    /* 투명(색상 없음) 버튼: 부드러운 회색 사선(대각선) 처리 */
    .color-circle[data-color="none"] {
        background: linear-gradient(to top right, transparent 46%, #d1d5db 46%, #d1d5db 54%, transparent 54%), #ffffff;
        border: max(1px, 0.08em) solid #d1d5db;
    }
    .color-circle[data-color="none"].active { border: max(2px, 0.15em) solid #1f2937; }

    .memo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6em; padding-bottom: 3.5em; padding-right: 0.4em; }
    .memo-list::-webkit-scrollbar { width: 0.4em; }
    .memo-list::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 0.2em; }
    .empty-state { margin: auto; color: #9ca3af; font-size: 1em; font-weight: 500; }

    /* 메모 아이템 (체크박스 위치 단단히 고정 및 우측 아이콘 밀착) */
    .memo-item {
        display: flex; align-items: center; 
        /* 색상 띠 유무와 무관하게 좌측 패딩 1.2em 강제 고정 */
        padding: 0.8em 0.8em 0.8em 1.2em; 
        background-color: var(--memo-bg); border-radius: 1.2em; 
        position: relative; gap: 0.4em; overflow: hidden;
    }
    .memo-color-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0.4em; }

    .check-btn {
        width: 1.3em; height: 1.3em; border-radius: 50%; border: max(1px, 0.1em) solid #cbd5e1; background: transparent;
        cursor: pointer; flex-shrink: 0; color: white; font-size: 0.8em;
    }
    .check-btn.checked { background-color: #cbd5e1; border-color: #cbd5e1; }

    /* 2. 텍스트 수정 시 파란색 밑줄 UI 활성화 */
    .memo-text { 
        flex: 1; font-size: 0.95em; color: var(--text-color); line-height: 1.4; outline: none; word-break: break-word; 
        border-bottom: 2px solid transparent; /* 평상시엔 투명 선 */
        padding-bottom: 2px;
        transition: border-bottom-color 0.2s;
    }
    .memo-text:focus { 
        border-bottom-color: var(--primary-color); /* 포커스(클릭) 시 파란색 선 나타남 */
    }
    .memo-text.checked-text { text-decoration: line-through; opacity: 0.4; border-bottom: none; }

    /* 1. 별 아이콘을 오른쪽으로 띄우기 위해 약간의 margin 추가 */
    .star-btn { background: transparent; border: none; font-size: 1.2em; cursor: pointer; color: #cbd5e1; width: 1.5em; height: 1.5em; margin-left: 0.2em; }
    .star-btn.starred { color: #fbbf24; }

    .delete-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; font-size: 1.4em; width: 1.5em; height: 1.5em; }
    .delete-btn:hover { color: #ef4444; }

    /* S/M/L 사이즈 컨트롤 */
    .size-controls { 
        position: absolute; bottom: 1.5em; right: 1.5em; display: flex; gap: 0.4em; 
        background-color: var(--memo-bg); border-radius: 1em; padding: 0.3em; 
    }
    body.embed-mode .size-controls { box-shadow: 0 0.2em 0.8em rgba(0,0,0,0.05); }
    .size-btn {
        width: 1.8em; height: 1.8em; border-radius: 50%; border: max(1px, 0.08em) solid var(--border-color); background-color: white;
        color: #6b7280; font-size: 0.7em; font-weight: bold; cursor: pointer;
    }
    .size-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

    /* 모달 설정창 UI (비율에 영향받지 않도록 px로 안전 고정) */
    #settings-btn { position: fixed; top: 15px; right: 15px; font-size: 24px; background: none; border: none; cursor: pointer; z-index: 100; text-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    #settings-modal {
        display: none; position: fixed; top: 0; right: 0; width: 320px; height: 100vh;
        background-color: #ffffff; padding: 25px; box-shadow: -4px 0 15px rgba(0,0,0,0.1); z-index: 101; overflow-y: auto; color: #333;
    }
    .setting-group { margin-bottom: 20px; }
    .setting-label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .setting-input { width: 100%; height: 40px; border: none; cursor: pointer; padding: 0; }
    .setting-input-text { width: 100%; height: 38px; border: 1px solid #ddd; border-radius: 6px; padding: 0 10px; font-size: 14px; outline: none; font-family: inherit; }
    .setting-input-text:focus { border-color: #6366f1; }
    .checkbox-wrap { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
    .close-btn { background: #111; color: #fff; border: none; padding: 10px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 20px; }
    .link-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
    .link-box { display: flex; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    #generated-link { flex: 1; border: none; padding: 10px; font-size: 11px; outline: none; background: #f9f9f9; }
    #copy-btn { background: #111; color: #fff; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<button id="settings-btn" title="설정">⚙️</button>

<div id="settings-modal">
    <button class="close-btn" id="close-settings">닫기</button>
    
    <div class="setting-group">
        <label class="setting-label">위젯 제목</label>
        <input type="text" class="setting-input-text" id="inp-title" value="MEMO" placeholder="MEMO">
    </div>

    <div class="setting-group">
        <label class="setting-label">그림자 표시</label>
        <label class="checkbox-wrap">
            <input type="checkbox" id="inp-shadow" checked style="width:16px; height:16px;"> 그림자 켜기
        </label>
    </div>

    <div class="setting-group">
        <label class="setting-label">위젯 본체 배경색</label>
        <input type="color" class="setting-input" id="inp-bg-color" value="#ffffff">
    </div>

    <div class="setting-group">
        <label class="setting-label">입력창 & 메모 배경색</label>
        <input type="color" class="setting-input" id="inp-memo-bg" value="#f3f4f6">
    </div>
    <div class="setting-group">
        <label class="setting-label">포인트 색상</label>
        <input type="color" class="setting-input" id="inp-primary-color" value="#6366f1">
    </div>
    <div class="setting-group">
        <label class="setting-label">텍스트 색상</label>
        <input type="color" class="setting-input" id="inp-text-color" value="#1f2937">
    </div>

    <div class="link-section">
        <label class="setting-label">노션 임베드용 링크</label>
        <div class="link-box">
            <input type="text" id="generated-link" readonly>
            <button id="copy-btn">복사</button>
        </div>
    </div>
</div>

<div class="scale-wrapper">
    <div class="widget-container" id="widget-container">
        <div class="header" id="widget-header">MEMO</div>
        
        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="memo-input" placeholder="메모를 입력하세요" autocomplete="off">
                <button class="add-btn center-icon" id="add-btn">+</button>
            </div>
            <!-- 파스텔 톤 7가지 색상 -->
            <div class="color-picker" id="color-picker">
                <div class="color-circle center-icon active" data-color="none"></div>
                <div class="color-circle" style="background-color: #f87b9c;" data-color="#f87b9c"></div>
                <div class="color-circle" style="background-color: #79a7fb;" data-color="#79a7fb"></div>
                <div class="color-circle" style="background-color: #a5e29f;" data-color="#a5e29f"></div>
                <div class="color-circle" style="background-color: #fae388;" data-color="#fae388"></div>
                <div class="color-circle" style="background-color: #ccabf6;" data-color="#ccabf6"></div>
                <div class="color-circle" style="background-color: #f7b078;" data-color="#f7b078"></div>
            </div>
        </div>

        <div class="memo-list" id="memo-list"></div>

        <div class="size-controls" id="size-controls">
            <button class="size-btn center-icon" data-size="S">S</button>
            <button class="size-btn center-icon active" data-size="M">M</button>
            <button class="size-btn center-icon" data-size="L">L</button>
        </div>
    </div>
</div>

<script>
// 오류 없는 스크립트 실행 (즉시실행함수)
(function() {
    try {
        const els = {
            input: document.getElementById('memo-input'),
            addBtn: document.getElementById('add-btn'),
            colorCircles: document.querySelectorAll('.color-circle'),
            memoList: document.getElementById('memo-list'),
            sizeBtns: document.querySelectorAll('.size-btn'),
            root: document.documentElement,
            settingsBtn: document.getElementById('settings-btn'),
            settingsModal: document.getElementById('settings-modal'),
            closeSettings: document.getElementById('close-settings'),
            generatedLink: document.getElementById('generated-link'),
            copyBtn: document.getElementById('copy-btn'),
            header: document.getElementById('widget-header'), 
            titleInput: document.getElementById('inp-title'),
            shadowCheckbox: document.getElementById('inp-shadow'),
            bgColor: document.getElementById('inp-bg-color'),
            memoBg: document.getElementById('inp-memo-bg'),
            primaryColor: document.getElementById('inp-primary-color'),
            textColor: document.getElementById('inp-text-color')
        };

        let selectedColor = 'none'; 
        let memos = [];
        let currentSize = 'M';

        // 안전한 저장소 키 호출
        try {
            const stored = localStorage.getItem('custom_memos_vfinal_safe');
            if (stored) memos = JSON.parse(stored);
            if (!Array.isArray(memos)) memos = [];
        } catch (e) { memos = []; }

        try { currentSize = localStorage.getItem('custom_memo_size_vfinal_safe') || 'M'; } catch (e) {}

        function renderMemos() {
            if(!els.memoList) return;
            els.memoList.innerHTML = '';
            
            if (memos.length === 0) {
                els.memoList.innerHTML = '<div class="empty-state">No memos yet</div>';
                return;
            }

            const sortedMemos = [...memos].sort((a, b) => {
                if (a.isStarred && !b.isStarred) return -1;
                if (!a.isStarred && b.isStarred) return 1;
                return b.id - a.id; 
            });

            sortedMemos.forEach((memo) => {
                const item = document.createElement('div');
                item.className = 'memo-item';
                
                // 패딩 고정으로 색상 유무와 무관하게 체크박스 밀림 방지
                if (memo.color !== 'none') {
                    const colorBar = document.createElement('div');
                    colorBar.className = 'memo-color-bar';
                    colorBar.style.backgroundColor = memo.color;
                    item.appendChild(colorBar);
                }

                const checkBtn = document.createElement('button');
                checkBtn.className = `check-btn center-icon ${memo.isChecked ? 'checked' : ''}`;
                checkBtn.innerHTML = memo.isChecked ? '✓' : '';
                checkBtn.onclick = () => toggleCheck(memo.id);

                const text = document.createElement('div');
                text.className = `memo-text ${memo.isChecked ? 'checked-text' : ''}`;
                text.contentEditable = true;
                text.innerText = memo.text;
                text.onblur = (e) => updateMemoText(memo.id, e.target.innerText);
                text.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); text.blur(); } };

                const starBtn = document.createElement('button');
                starBtn.className = `star-btn center-icon ${memo.isStarred ? 'starred' : ''}`;
                starBtn.innerHTML = memo.isStarred ? '★' : '☆';
                starBtn.onclick = () => toggleStar(memo.id);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn center-icon';
                deleteBtn.innerHTML = '×';
                deleteBtn.onclick = () => deleteMemo(memo.id);

                item.appendChild(checkBtn);
                item.appendChild(text);
                item.appendChild(starBtn);
                item.appendChild(deleteBtn);
                
                els.memoList.appendChild(item);
            });
        }

        function addMemo() {
            if(!els.input) return;
            const text = els.input.value.trim();
            if (!text) return;
            memos.push({ id: Date.now(), text: text, color: selectedColor, isStarred: false, isChecked: false });
            saveAndRender();
            els.input.value = '';
        }

        function toggleStar(id) {
            const target = memos.find(m => m.id === id);
            if (target) { target.isStarred = !target.isStarred; saveAndRender(); }
        }

        function toggleCheck(id) {
            const target = memos.find(m => m.id === id);
            if (target) { target.isChecked = !target.isChecked; saveAndRender(); }
        }

        function updateMemoText(id, newText) {
            const target = memos.find(m => m.id === id);
            if (target && newText.trim() !== '') { target.text = newText; saveAndRender(); }
        }

        function deleteMemo(id) {
            memos = memos.filter(m => m.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            try { localStorage.setItem('custom_memos_vfinal_safe', JSON.stringify(memos)); } catch(e) {}
            renderMemos();
        }

        // 반응형 S/M/L 스케일 변경 함수
        function applySize(size) {
            let scale = 1;
            if (size === 'S' || size === '14') scale = 0.85;
            if (size === 'L' || size === '18') scale = 1.15;
            
            els.root.style.setProperty('--scale', scale);
            els.sizeBtns.forEach(btn => {
                if (btn.dataset.size === size) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            try { localStorage.setItem('custom_memo_size_vfinal_safe', size); } catch(e) {}
        }

        function applySettings() {
            if(els.bgColor) els.root.style.setProperty('--bg-color', els.bgColor.value);
            if(els.shadowCheckbox) els.root.style.setProperty('--widget-shadow', els.shadowCheckbox.checked ? '0 0.3em 1em rgba(0,0,0,0.08)' : 'none');
            if(els.memoBg) els.root.style.setProperty('--memo-bg', els.memoBg.value);
            if(els.primaryColor) els.root.style.setProperty('--primary-color', els.primaryColor.value);
            if(els.textColor) els.root.style.setProperty('--text-color', els.textColor.value);
            updateGeneratedLink();
        }

        function updateGeneratedLink() {
            if(!els.generatedLink) return;
            try {
                const url = new URL(window.location.href.split('?')[0]);
                url.searchParams.set('embed', 'true');
                if(els.titleInput) url.searchParams.set('title', encodeURIComponent(els.titleInput.value));
                if(els.shadowCheckbox) url.searchParams.set('sh', els.shadowCheckbox.checked ? '1' : '0');
                if(els.bgColor) url.searchParams.set('bg', els.bgColor.value.replace('#', ''));
                if(els.memoBg) url.searchParams.set('mbg', els.memoBg.value.replace('#', ''));
                if(els.primaryColor) url.searchParams.set('pc', els.primaryColor.value.replace('#', ''));
                if(els.textColor) url.searchParams.set('tc', els.textColor.value.replace('#', ''));
                els.generatedLink.value = url.href;
            } catch(e) {}
        }

        function loadConfigFromURL() {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('embed') === 'true') {
                    if(els.settingsBtn) els.settingsBtn.style.display = 'none';
                    document.body.classList.add('embed-mode');
                    
                    if(params.get('title') && els.titleInput && els.header) {
                        const decodedTitle = decodeURIComponent(params.get('title'));
                        els.header.innerText = decodedTitle || 'MEMO';
                        els.titleInput.value = decodedTitle;
                    }
                    if(params.has('sh') && els.shadowCheckbox) els.shadowCheckbox.checked = params.get('sh') === '1';
                    if(params.get('bg') && els.bgColor) els.bgColor.value = '#' + params.get('bg');
                    if(params.get('mbg') && els.memoBg) els.memoBg.value = '#' + params.get('mbg');
                    if(params.get('pc') && els.primaryColor) els.primaryColor.value = '#' + params.get('pc');
                    if(params.get('tc') && els.textColor) els.textColor.value = '#' + params.get('tc');
                    
                    applySettings();
                    return true;
                }
            } catch(e) {}
            
            applySettings();
            return false;
        }

        // --- 이벤트 리스너 바인딩 ---
        els.colorCircles.forEach(circle => {
            circle.addEventListener('click', (e) => {
                els.colorCircles.forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedColor = e.target.dataset.color;
            });
        });

        if(els.addBtn) els.addBtn.addEventListener('click', addMemo);
        if(els.input) els.input.addEventListener('keypress', (e) => { if (e.key === 'Enter') addMemo(); });
        els.sizeBtns.forEach(btn => { btn.addEventListener('click', (e) => applySize(e.target.dataset.size)); });

        if(els.settingsBtn) els.settingsBtn.addEventListener('click', () => { if(els.settingsModal) els.settingsModal.style.display = 'block'; });
        if(els.closeSettings) els.closeSettings.addEventListener('click', () => { if(els.settingsModal) els.settingsModal.style.display = 'none'; });

        if(els.titleInput) els.titleInput.addEventListener('input', (e) => {
            if(els.header) els.header.innerText = e.target.value || 'MEMO';
            updateGeneratedLink();
        });

        [els.bgColor, els.memoBg, els.primaryColor, els.textColor].forEach(el => { 
            if(el) el.addEventListener('input', applySettings); 
        });
        if(els.shadowCheckbox) els.shadowCheckbox.addEventListener('change', applySettings);

        if(els.copyBtn) els.copyBtn.addEventListener('click', () => {
            if(!els.generatedLink) return;
            els.generatedLink.select();
            document.execCommand('copy');
            els.copyBtn.innerText = '완료';
            setTimeout(() => els.copyBtn.innerText = '복사', 1500);
        });

        // 초기 실행
        if (!loadConfigFromURL()) {
            updateGeneratedLink();
        }
        applySize(currentSize);
        renderMemos();

    } catch (error) {
        console.error("Widget initialization failed:", error);
    }
})();
</script>
</body>
</html>
