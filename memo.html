<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Memo Widget</title>
<style>
    :root {
        --font-scale: 1; /* S, M, L 버튼을 통해 변경됨 */
        --primary-color: #6366f1;
        --bg-color: #ffffff;
        --memo-bg: #f3f4f6;
        --text-color: #1f2937;
        --border-color: #e5e7eb;
        --widget-shadow: 0 1cqi 4cqi rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex; justify-content: center; align-items: center;
        height: 100vh; background-color: transparent; overflow: hidden;
    }

    /* 반응형을 위한 컨테이너 래퍼 */
    .widget-wrapper {
        container-type: inline-size;
        width: 100%; max-width: 450px; 
        height: 100%; max-height: 800px;
        display: flex; flex-direction: column; justify-content: center;
    }

    /* 노션 임베드 모드: 둥근 모서리와 그림자가 잘리지 않도록 여백 부여 */
    body.embed-mode .widget-wrapper {
        max-width: 100%; max-height: 100vh;
        padding: 4cqi; 
    }

    /* 내부 컨텐츠 (cqi 단위를 사용하여 부모 너비에 비례해 완벽하게 스케일링 됨) */
    .widget-container {
        flex: 1;
        background-color: var(--bg-color); border-radius: 6cqi;
        padding: 7.5cqi; display: flex; flex-direction: column;
        box-shadow: var(--widget-shadow); position: relative; overflow: hidden;
    }

    .header { 
        font-size: calc(7cqi * var(--font-scale)); font-weight: 900; 
        color: var(--text-color); margin-bottom: 5cqi; letter-spacing: -0.02em; word-break: break-all; 
    }

    .input-section { margin-bottom: 4cqi; }
    .input-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 3cqi; }
    
    .input-wrapper input {
        width: 100%; padding: 4cqi 13cqi 4cqi 5cqi; border: none; border-radius: 25cqi;
        background-color: var(--memo-bg); font-size: calc(3.8cqi * var(--font-scale)); outline: none; color: var(--text-color);
    }
    .input-wrapper input::placeholder { color: #9ca3af; }

    /* 아이콘 완벽 정중앙 정렬 유틸리티 */
    .center-icon {
        display: flex; justify-content: center; align-items: center; 
        line-height: 0 !important; padding: 0 !important; margin: 0;
    }

    .add-btn {
        position: absolute; right: 2cqi; width: 9cqi; height: 9cqi; border-radius: 50%;
        background-color: var(--primary-color); color: white; border: none; 
        font-size: 5.5cqi; cursor: pointer; transition: transform 0.1s;
    }
    .add-btn:active { transform: scale(0.95); }

    .color-picker { display: flex; gap: 2.5cqi; padding: 0 2.5cqi; }
    .color-circle {
        width: 4.5cqi; height: 4.5cqi; border-radius: 50%; cursor: pointer;
        border: max(1px, 0.4cqi) solid transparent; transition: transform 0.2s;
    }
    .color-circle.active { border: max(2px, 0.7cqi) solid #1f2937; transform: scale(1.15); }
    
    /* 1. 색상 없음 아이콘: CSS 사선 처리 */
    .color-circle[data-color="none"] {
        background: linear-gradient(to top right, transparent 46%, #9ca3af 46%, #9ca3af 54%, transparent 54%), #ffffff;
        border: max(1px, 0.4cqi) solid #d1d5db;
    }
    .color-circle[data-color="none"].active { border: max(2px, 0.7cqi) solid #1f2937; }

    .memo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2.5cqi; padding-bottom: 12cqi; padding-right: 1.5cqi; }
    .memo-list::-webkit-scrollbar { width: 1.5cqi; }
    .memo-list::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 1cqi; }
    .empty-state { margin: auto; color: #9ca3af; font-size: calc(3.5cqi * var(--font-scale)); font-weight: 500; }

    .memo-item {
        display: flex; align-items: center; 
        padding: 3cqi 3cqi 3cqi 5cqi;
        background-color: var(--memo-bg); border-radius: 4cqi; 
        position: relative; gap: 2.5cqi; overflow: hidden;
    }
    /* 색상 바가 없을 때 왼쪽 패딩 좁히기 */
    .memo-item.no-color { padding-left: 3cqi; }
    .memo-color-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 1.5cqi; }

    .check-btn {
        width: 5cqi; height: 5cqi; border-radius: 50%; border: max(1px, 0.4cqi) solid #cbd5e1; background: transparent;
        cursor: pointer; flex-shrink: 0; color: white; font-size: 3.5cqi;
    }
    .check-btn.checked { background-color: #cbd5e1; border-color: #cbd5e1; }

    .memo-text { 
        flex: 1; font-size: calc(3.6cqi * var(--font-scale)); color: var(--text-color); 
        line-height: 1.4; outline: none; word-break: break-word; 
    }
    .memo-text.checked-text { text-decoration: line-through; opacity: 0.4; }

    .star-btn { background: transparent; border: none; font-size: 5cqi; cursor: pointer; color: #cbd5e1; width: 6cqi; height: 6cqi; }
    .star-btn.starred { color: #fbbf24; }

    .delete-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; font-size: 5.5cqi; width: 6cqi; height: 6cqi; }
    .delete-btn:hover { color: #ef4444; }

    .size-controls { 
        position: absolute; bottom: 5cqi; right: 5cqi; display: flex; gap: 1.5cqi; 
        background-color: var(--bg-color); border-radius: 5cqi; padding: 1cqi; 
    }
    body.embed-mode .size-controls { box-shadow: 0 0.5cqi 2cqi rgba(0,0,0,0.08); }
    .size-btn {
        width: 7cqi; height: 7cqi; border-radius: 50%; border: max(1px, 0.4cqi) solid var(--border-color); background-color: white;
        color: #6b7280; font-size: 2.5cqi; font-weight: bold; cursor: pointer;
    }
    .size-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

    /* 모달 설정창 UI (데스크탑 고정 픽셀) */
    #settings-btn { position: fixed; top: 15px; right: 15px; font-size: 22px; background: none; border: none; cursor: pointer; z-index: 100; }
    #settings-modal {
        display: none; position: fixed; top: 0; right: 0; width: 320px; height: 100vh;
        background-color: #ffffff; padding: 25px; box-shadow: -4px 0 15px rgba(0,0,0,0.1); z-index: 101; overflow-y: auto; color: #333;
    }
    .setting-group { margin-bottom: 20px; }
    .setting-label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .setting-input { width: 100%; height: 40px; border: none; cursor: pointer; padding: 0; }
    .setting-input-text { width: 100%; height: 38px; border: 1px solid #ddd; border-radius: 6px; padding: 0 10px; font-size: 14px; outline: none; font-family: inherit; }
    .setting-input-text:focus { border-color: #6366f1; }
    .checkbox-wrap { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .close-btn { background: #111; color: #fff; border: none; padding: 10px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 20px; }
    .link-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
    .link-box { display: flex; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    #generated-link { flex: 1; border: none; padding: 10px; font-size: 11px; outline: none; background: #f9f9f9; }
    #copy-btn { background: #111; color: #fff; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<button id="settings-btn" title="설정">⚙️</button>

<div id="settings-modal">
    <button class="close-btn" id="close-settings">닫기</button>
    
    <div class="setting-group">
        <label class="setting-label">위젯 제목</label>
        <input type="text" class="setting-input-text" id="inp-title" value="MEMO" placeholder="MEMO">
    </div>

    <div class="setting-group">
        <label class="setting-label">그림자 표시</label>
        <label class="checkbox-wrap">
            <input type="checkbox" id="inp-shadow" checked style="width:16px; height:16px;"> 그림자 켜기
        </label>
    </div>

    <div class="setting-group">
        <label class="setting-label">위젯 전체 배경색</label>
        <input type="color" class="setting-input" id="inp-bg-color" value="#ffffff">
    </div>
    <div class="setting-group">
        <label class="setting-label">입력창 & 메모 배경색</label>
        <input type="color" class="setting-input" id="inp-memo-bg" value="#f3f4f6">
    </div>
    <div class="setting-group">
        <label class="setting-label">포인트 색상</label>
        <input type="color" class="setting-input" id="inp-primary-color" value="#6366f1">
    </div>
    <div class="setting-group">
        <label class="setting-label">텍스트 색상</label>
        <input type="color" class="setting-input" id="inp-text-color" value="#1f2937">
    </div>

    <div class="link-section">
        <label class="setting-label">노션 임베드용 링크</label>
        <div class="link-box">
            <input type="text" id="generated-link" readonly>
            <button id="copy-btn">복사</button>
        </div>
    </div>
</div>

<div class="widget-wrapper">
    <div class="widget-container">
        <div class="header" id="widget-header">MEMO</div>
        
        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="memo-input" placeholder="메모를 입력하세요" autocomplete="off">
                <button class="add-btn center-icon" id="add-btn">+</button>
            </div>
            <div class="color-picker" id="color-picker">
                <div class="color-circle active" data-color="none"></div>
                <div class="color-circle" style="background-color: #f472b6;" data-color="#f472b6"></div>
                <div class="color-circle" style="background-color: #60a5fa;" data-color="#60a5fa"></div>
                <div class="color-circle" style="background-color: #4ade80;" data-color="#4ade80"></div>
                <div class="color-circle" style="background-color: #fef08a;" data-color="#fef08a"></div>
                <div class="color-circle" style="background-color: #fb923c;" data-color="#fb923c"></div>
            </div>
        </div>

        <div class="memo-list" id="memo-list"></div>

        <div class="size-controls" id="size-controls">
            <button class="size-btn center-icon" data-size="S">S</button>
            <button class="size-btn center-icon active" data-size="M">M</button>
            <button class="size-btn center-icon" data-size="L">L</button>
        </div>
    </div>
</div>

<script>
    const els = {
        input: document.getElementById('memo-input'), addBtn: document.getElementById('add-btn'),
        colorCircles: document.querySelectorAll('.color-circle'), memoList: document.getElementById('memo-list'),
        sizeBtns: document.querySelectorAll('.size-btn'), root: document.documentElement,
        settingsBtn: document.getElementById('settings-btn'), settingsModal: document.getElementById('settings-modal'),
        closeSettings: document.getElementById('close-settings'), generatedLink: document.getElementById('generated-link'),
        copyBtn: document.getElementById('copy-btn'), header: document.getElementById('widget-header'), 
        titleInput: document.getElementById('inp-title'), shadowCheckbox: document.getElementById('inp-shadow'),
        bgColor: document.getElementById('inp-bg-color'), memoBg: document.getElementById('inp-memo-bg'),
        primaryColor: document.getElementById('inp-primary-color'), textColor: document.getElementById('inp-text-color')
    };

    let selectedColor = 'none'; 
    let memos = [];
    let currentSize = 'M';

    try {
        const stored = localStorage.getItem('custom_memos_vfinal');
        if (stored) memos = JSON.parse(stored);
        if (!Array.isArray(memos)) memos = [];
    } catch (e) { memos = []; }

    try { currentSize = localStorage.getItem('custom_memo_size_final') || 'M'; } catch (e) {}

    function init() {
        if (!loadConfigFromURL()) {
            updateGeneratedLink();
        }
        applySize(currentSize);
        renderMemos();
    }

    function renderMemos() {
        els.memoList.innerHTML = '';
        if (memos.length === 0) {
            els.memoList.innerHTML = '<div class="empty-state">No memos yet</div>';
            return;
        }

        const sortedMemos = [...memos].sort((a, b) => {
            if (a.isStarred && !b.isStarred) return -1;
            if (!a.isStarred && b.isStarred) return 1;
            return b.id - a.id; 
        });

        sortedMemos.forEach((memo) => {
            const item = document.createElement('div');
            item.className = 'memo-item';
            
            // 색상 없음 처리 (여백 좁히기 적용)
            if (memo.color !== 'none') {
                const colorBar = document.createElement('div');
                colorBar.className = 'memo-color-bar';
                colorBar.style.backgroundColor = memo.color;
                item.appendChild(colorBar);
            } else {
                item.classList.add('no-color');
            }

            const checkBtn = document.createElement('button');
            checkBtn.className = `check-btn center-icon ${memo.isChecked ? 'checked' : ''}`;
            checkBtn.innerHTML = memo.isChecked ? '✓' : '';
            checkBtn.onclick = () => toggleCheck(memo.id);

            const text = document.createElement('div');
            text.className = `memo-text ${memo.isChecked ? 'checked-text' : ''}`;
            text.contentEditable = true;
            text.innerText = memo.text;
            text.onblur = (e) => updateMemoText(memo.id, e.target.innerText);
            text.onkeydown = (e) => { if(e.key === 'Enter') { e.preventDefault(); text.blur(); } };

            const starBtn = document.createElement('button');
            starBtn.className = `star-btn center-icon ${memo.isStarred ? 'starred' : ''}`;
            starBtn.innerHTML = memo.isStarred ? '★' : '☆';
            starBtn.onclick = () => toggleStar(memo.id);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn center-icon';
            deleteBtn.innerHTML = '×';
            deleteBtn.onclick = () => deleteMemo(memo.id);

            item.appendChild(checkBtn);
            item.appendChild(text);
            item.appendChild(starBtn);
            item.appendChild(deleteBtn);
            
            els.memoList.appendChild(item);
        });
    }

    function addMemo() {
        const text = els.input.value.trim();
        if (!text) return;
        memos.push({ id: Date.now(), text: text, color: selectedColor, isStarred: false, isChecked: false });
        saveAndRender();
        els.input.value = '';
    }

    function toggleStar(id) {
        const target = memos.find(m => m.id === id);
        if(target) { target.isStarred = !target.isStarred; saveAndRender(); }
    }

    function toggleCheck(id) {
        const target = memos.find(m => m.id === id);
        if(target) { target.isChecked = !target.isChecked; saveAndRender(); }
    }

    function updateMemoText(id, newText) {
        const target = memos.find(m => m.id === id);
        if(target && newText.trim() !== '') { target.text = newText; saveAndRender(); }
    }

    function deleteMemo(id) {
        memos = memos.filter(m => m.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        try { localStorage.setItem('custom_memos_vfinal', JSON.stringify(memos)); } catch(e) {}
        renderMemos();
    }

    function applySize(size) {
        let scale = 1;
        if (size === 'S' || size === '14') scale = 0.85;
        if (size === 'L' || size === '18') scale = 1.15;
        
        els.root.style.setProperty('--font-scale', scale);
        els.sizeBtns.forEach(btn => {
            if (btn.dataset.size === size) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        try { localStorage.setItem('custom_memo_size_final', size); } catch(e) {}
    }

    els.colorCircles.forEach(circle => {
        circle.addEventListener('click', (e) => {
            els.colorCircles.forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            selectedColor = e.target.dataset.color;
        });
    });

    els.addBtn.addEventListener('click', addMemo);
    els.input.addEventListener('keypress', (e) => { if (e.key === 'Enter') addMemo(); });
    els.sizeBtns.forEach(btn => { btn.addEventListener('click', (e) => applySize(e.target.dataset.size)); });

    els.settingsBtn.addEventListener('click', () => els.settingsModal.style.display = 'block');
    els.closeSettings.addEventListener('click', () => els.settingsModal.style.display = 'none');

    els.titleInput.addEventListener('input', (e) => {
        els.header.innerText = e.target.value || 'MEMO';
        updateGeneratedLink();
    });

    function applySettings() {
        els.root.style.setProperty('--bg-color', els.bgColor.value);
        els.root.style.setProperty('--memo-bg', els.memoBg.value);
        els.root.style.setProperty('--primary-color', els.primaryColor.value);
        els.root.style.setProperty('--text-color', els.textColor.value);
        els.root.style.setProperty('--widget-shadow', els.shadowCheckbox.checked ? '0 1cqi 4cqi rgba(0,0,0,0.08)' : 'none');
        updateGeneratedLink();
    }

    [els.bgColor, els.memoBg, els.primaryColor, els.textColor].forEach(el => { el.addEventListener('input', applySettings); });
    els.shadowCheckbox.addEventListener('change', applySettings);

    function updateGeneratedLink() {
        try {
            const url = new URL(window.location.href.split('?')[0]);
            url.searchParams.set('embed', 'true');
            url.searchParams.set('title', encodeURIComponent(els.titleInput.value));
            url.searchParams.set('sh', els.shadowCheckbox.checked ? '1' : '0');
            url.searchParams.set('bg', els.bgColor.value.replace('#', ''));
            url.searchParams.set('mbg', els.memoBg.value.replace('#', ''));
            url.searchParams.set('pc', els.primaryColor.value.replace('#', ''));
            url.searchParams.set('tc', els.textColor.value.replace('#', ''));
            els.generatedLink.value = url.href;
        } catch(e) {}
    }

    function loadConfigFromURL() {
        try {
            const params = new URLSearchParams(window.location.search);
            if (params.get('embed') === 'true') {
                els.settingsBtn.style.display = 'none';
                document.body.classList.add('embed-mode');
                
                if(params.get('title')) {
                    const decodedTitle = decodeURIComponent(params.get('title'));
                    els.header.innerText = decodedTitle || 'MEMO';
                    els.titleInput.value = decodedTitle;
                }
                if(params.has('sh')) {
                    const hasShadow = params.get('sh') === '1';
                    els.shadowCheckbox.checked = hasShadow;
                    els.root.style.setProperty('--widget-shadow', hasShadow ? '0 1cqi 4cqi rgba(0,0,0,0.08)' : 'none');
                }
                if(params.get('bg')) els.root.style.setProperty('--bg-color', '#' + params.get('bg'));
                if(params.get('mbg')) els.root.style.setProperty('--memo-bg', '#' + params.get('mbg'));
                if(params.get('pc')) els.root.style.setProperty('--primary-color', '#' + params.get('pc'));
                if(params.get('tc')) els.root.style.setProperty('--text-color', '#' + params.get('tc'));
                return true;
            }
        } catch(e) {}
        return false;
    }

    els.copyBtn.addEventListener('click', () => {
        els.generatedLink.select();
        document.execCommand('copy');
        els.copyBtn.innerText = '완료';
        setTimeout(() => els.copyBtn.innerText = '복사', 1500);
    });

    init();
</script>
</body>
</html>
