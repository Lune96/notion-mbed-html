<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-Day Counter Widget</title>
<style>
    :root {
        --txt-size: 8vw;
        --day-size: 7vw;
        --dday-size: 24vw;
        --text-color: #000000;
        --bg-color: rgba(255, 255, 255, 1);
    }

    body {
        margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: transparent;
        overflow: hidden;
    }

    #widget-container {
        flex: 1; display: flex; flex-direction: column; justify-content: space-between;
        padding: 5vw 6vw; box-sizing: border-box; background-color: var(--bg-color);
        color: var(--text-color); transition: background-color 0.3s, color 0.3s;
    }
    .top-section { display: flex; flex-direction: column; gap: 0.2vw; }
    
    #disp-text { font-size: var(--txt-size); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    #disp-day { font-size: var(--day-size); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    
    .bottom-section { display: flex; align-items: flex-end; justify-content: flex-start; flex: 1; padding-bottom: 2vw; }
    #disp-dday { font-size: var(--dday-size); font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; }

    #settings-btn { position: fixed; top: 20px; right: 20px; font-size: 24px; background: transparent; border: none; color: #888; cursor: pointer; z-index: 100; transition: color 0.3s; }
    #settings-btn:hover { color: #333; }
    
    #settings-modal {
        display: none; position: fixed; top: 0; right: 0; width: 380px; height: 100vh;
        background-color: #ffffff; color: #333; padding: 25px; box-sizing: border-box;
        box-shadow: -4px 0 15px rgba(0,0,0,0.1); z-index: 101; overflow-y: auto;
    }

    .setting-category {
        background-color: #f7f7f7; border: 1px solid #ececec; border-radius: 12px;
        padding: 18px 15px; margin-bottom: 20px;
    }
    .setting-category .setting-group { margin-bottom: 15px; }
    .setting-category .setting-group:last-child { margin-bottom: 0; }
    .setting-label { font-size: 13px; color: #333; margin-bottom: 8px; display: block; font-weight: 500; }
    
    .input-bar {
        background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px;
        padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .input-bar input[type="text"], .input-bar input[type="date"] {
        border: none; background: transparent; outline: none; font-size: 14px; color: #333; flex: 1; font-weight: 500;
    }
    .input-bar input[type="color"] {
        border: none; background: transparent; width: 28px; height: 28px; padding: 0; cursor: pointer; border-radius: 4px;
    }
    .input-bar input[type="range"] {
        flex: 1; accent-color: #555; height: 4px; border-radius: 2px; margin-right: 10px;
    }

    .num-input-wrap { display: flex; align-items: center; justify-content: flex-end; width: 75px; }
    .num-input { 
        width: 45px; background-color: #f4f4f4; border: 1px solid #c0c0c0; border-radius: 4px; 
        padding: 4px 6px; text-align: right; font-size: 13px; color: #333; font-weight: 600; 
        outline: none; font-family: inherit; -moz-appearance: textfield; 
        transition: border-color 0.2s, background-color 0.2s;
    }
    .num-input:focus { border-color: #888; background-color: #ffffff; }
    .num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .unit { font-size: 13px; color: #666; font-weight: 600; margin-left: 4px; }

    .close-btn { background: #111; color: #fff; border: none; padding: 10px 12px; cursor: pointer; border-radius: 6px; margin-bottom: 25px; width: 100%; font-weight: bold; font-size: 14px; text-transform: uppercase; }
    
    .link-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 25px; }
    .link-title { font-size: 11px; color: #888; font-weight: bold; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    .link-box { display: flex; align-items: stretch; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; background: #fff; height: 40px; }
    .notion-icon { background: #fff; padding: 0 12px; display: flex; align-items: center; font-weight: bold; font-size: 16px; border-right: 1px solid #eee; }
    #generated-link { flex-grow: 1; border: none; padding: 0 12px; font-size: 12px; color: #333; outline: none; background: #f9f9f9; }
    #copy-btn { background: #111; color: #fff; border: none; padding: 0 16px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

    <button id="settings-btn">⚙️</button>
    
    <div id="settings-modal">
        <button class="close-btn" id="close-settings">Close</button>
        
        <div class="setting-category">
            <div class="setting-group">
                <label class="setting-label">Text</label>
                <div class="input-bar"><input type="text" id="inp-text" value="Text"></div>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">Text Size</label>
                <div class="input-bar">
                    <input type="range" id="inp-sz-txt" min="0.1" max="100" step="0.1" value="8">
                    <div class="num-input-wrap">
                        <input type="number" id="inp-val-txt" class="num-input" value="8" min="0.1" max="100" step="0.1">
                        <span class="unit">p</span>
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">Text Color</label>
                <div class="input-bar">
                    <input type="text" id="inp-txt-hex" value="#000000" maxlength="7" style="text-transform: uppercase;">
                    <input type="color" id="inp-txt-color" value="#000000">
                </div>
            </div>
        </div>
        
        <div class="setting-category">
            <div class="setting-group">
                <label class="setting-label">Day</label>
                <div class="input-bar"><input type="text" id="inp-day" value="2000-01-01"></div>
            </div>

            <div class="setting-group">
                <label class="setting-label">Day Size</label>
                <div class="input-bar">
                    <input type="range" id="inp-sz-day" min="0.1" max="100" step="0.1" value="7">
                    <div class="num-input-wrap">
                        <input type="number" id="inp-val-day" class="num-input" value="7" min="0.1" max="100" step="0.1">
                        <span class="unit">p</span>
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">D-day Size</label>
                <div class="input-bar">
                    <input type="range" id="inp-sz-dday" min="0.1" max="100" step="0.1" value="24">
                    <div class="num-input-wrap">
                        <input type="number" id="inp-val-dday" class="num-input" value="24" min="0.1" max="100" step="0.1">
                        <span class="unit">p</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="setting-category">
            <div class="setting-group">
                <label class="setting-label">Background Color</label>
                <div class="input-bar">
                    <input type="text" id="inp-bg-hex" value="#FFFFFF" maxlength="7" style="text-transform: uppercase;">
                    <input type="color" id="inp-bg-color" value="#ffffff">
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">Background Opacity</label>
                <div class="input-bar">
                    <input type="range" id="inp-bg-op" min="0" max="100" step="0.1" value="100">
                    <div class="num-input-wrap">
                        <input type="number" id="inp-val-bg-op" class="num-input" value="100" min="0" max="100" step="0.1">
                        <span class="unit">%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="link-section">
            <div class="link-title">COPY LINK, PASTE INTO NOTION, AND CLICK 'EMBED'</div>
            <div class="link-box">
                <div class="notion-icon">N</div>
                <input type="text" id="generated-link" readonly>
                <button id="copy-btn" title="Copy to clipboard">📋</button>
            </div>
        </div>
    </div>

    <div id="widget-container">
        <div class="top-section">
            <div id="disp-text">Text</div>
            <div id="disp-day">2000-01-01</div>
        </div>
        <div class="bottom-section">
            <div id="disp-dday">D-Day</div>
        </div>
    </div>

<script>
    // DOM 로드 완료 후 안전하게 스크립트 실행 보장
    document.addEventListener('DOMContentLoaded', () => {
        try {
            // 모달 작동 로직 (우선 배치)
            const setBtn = document.getElementById('settings-btn');
            const setModal = document.getElementById('settings-modal');
            const closeBtn = document.getElementById('close-settings');
            if (setBtn && setModal) setBtn.addEventListener('click', () => setModal.style.display = 'block');
            if (closeBtn && setModal) closeBtn.addEventListener('click', () => setModal.style.display = 'none');

            const els = {
                inpText: document.getElementById('inp-text'), inpDay: document.getElementById('inp-day'),
                szTxt: document.getElementById('inp-sz-txt'), szDay: document.getElementById('inp-sz-day'), szDday: document.getElementById('inp-sz-dday'),
                valTxt: document.getElementById('inp-val-txt'), valDay: document.getElementById('inp-val-day'), valDday: document.getElementById('inp-val-dday'),
                bgHex: document.getElementById('inp-bg-hex'), bgColor: document.getElementById('inp-bg-color'),
                bgOp: document.getElementById('inp-bg-op'), valBgOp: document.getElementById('inp-val-bg-op'),
                txtHex: document.getElementById('inp-txt-hex'), txtColor: document.getElementById('inp-txt-color'),
                dispText: document.getElementById('disp-text'), dispDay: document.getElementById('disp-day'), dispDday: document.getElementById('disp-dday'),
                generatedLink: document.getElementById('generated-link'), copyBtn: document.getElementById('copy-btn')
            };

            function hexToRgba(hex, opacity) {
                if(!hex) return 'transparent';
                hex = hex.replace('#', '');
                if(hex.length === 3) hex = hex.split('').map(char => char + char).join('');
                const r = parseInt(hex.slice(0, 2), 16) || 0;
                const g = parseInt(hex.slice(2, 4), 16) || 0;
                const b = parseInt(hex.slice(4, 6), 16) || 0;
                return `rgba(${r}, ${g}, ${b}, ${opacity / 100})`;
            }

            function updateDdayCalc() {
                if(!els.inpDay || !els.dispDay || !els.dispDday) return;
                const targetStr = els.inpDay.value.trim();
                els.dispDay.innerText = targetStr;

                const targetDate = new Date(targetStr);
                if (isNaN(targetDate.getTime())) {
                    els.dispDday.innerText = "D-?";
                    return;
                }

                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const target = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
                
                const diffTime = today - target;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
                els.dispDday.innerText = diffDays >= 0 ? "D+" + diffDays : "D" + diffDays;
            }

            function updateGeneratedLink() {
                try {
                    if(!els.generatedLink) return;
                    const url = new URL(window.location.href);
                    if(els.inpText) url.searchParams.set('txt', els.inpText.value);
                    if(els.inpDay) url.searchParams.set('day', els.inpDay.value);
                    if(els.szTxt) url.searchParams.set('st', els.szTxt.value);
                    if(els.szDay) url.searchParams.set('sd', els.szDay.value);
                    if(els.szDday) url.searchParams.set('sdd', els.szDday.value);
                    if(els.bgHex) url.searchParams.set('bc', els.bgHex.value.replace('#', ''));
                    if(els.bgOp) url.searchParams.set('bo', els.bgOp.value);
                    if(els.txtHex) url.searchParams.set('tc', els.txtHex.value.replace('#', ''));
                    els.generatedLink.value = url.href;
                } catch(e) {}
            }

            function applyConfig() {
                if(els.dispText && els.inpText) els.dispText.innerText = els.inpText.value;
                updateDdayCalc();

                if(els.valTxt && els.szTxt) els.valTxt.value = els.szTxt.value;
                if(els.valDay && els.szDay) els.valDay.value = els.szDay.value;
                if(els.valDday && els.szDday) els.valDday.value = els.szDday.value;
                if(els.valBgOp && els.bgOp) els.valBgOp.value = els.bgOp.value;

                if(els.szTxt) document.documentElement.style.setProperty('--txt-size', els.szTxt.value + 'vw');
                if(els.szDay) document.documentElement.style.setProperty('--day-size', els.szDay.value + 'vw');
                if(els.szDday) document.documentElement.style.setProperty('--dday-size', els.szDday.value + 'vw');
                if(els.txtHex) document.documentElement.style.setProperty('--text-color', els.txtHex.value);
                if(els.bgHex && els.bgOp) document.documentElement.style.setProperty('--bg-color', hexToRgba(els.bgHex.value, els.bgOp.value));

                updateGeneratedLink();
            }

            function syncInputRange(numEl, rangeEl) {
                if(!numEl || !rangeEl) return;
                
                numEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') numEl.blur();
                });

                numEl.addEventListener('change', () => {
                    let val = parseFloat(numEl.value);
                    let min = parseFloat(rangeEl.min);
                    let max = parseFloat(rangeEl.max);
                    
                    if (isNaN(val)) val = min;
                    if (val < min) val = min;
                    if (val > max) val = max;
                    
                    val = Math.round(val * 10) / 10;
                    numEl.value = val;
                    rangeEl.value = val;
                    applyConfig();
                });

                rangeEl.addEventListener('input', () => {
                    numEl.value = rangeEl.value;
                    applyConfig();
                });
            }

            syncInputRange(els.valTxt, els.szTxt);
            syncInputRange(els.valDay, els.szDay);
            syncInputRange(els.valDday, els.szDday);
            syncInputRange(els.valBgOp, els.bgOp);

            ['change', 'input'].forEach(evt => {
                if(els.inpText) els.inpText.addEventListener(evt, applyConfig);
                if(els.inpDay) els.inpDay.addEventListener(evt, applyConfig);

                if(els.bgColor && els.bgHex) {
                    els.bgColor.addEventListener(evt, (e) => { els.bgHex.value = e.target.value.toUpperCase(); applyConfig(); });
                    els.bgHex.addEventListener(evt, (e) => { els.bgColor.value = e.target.value; applyConfig(); });
                }
                if(els.txtColor && els.txtHex) {
                    els.txtColor.addEventListener(evt, (e) => { els.txtHex.value = e.target.value.toUpperCase(); applyConfig(); });
                    els.txtHex.addEventListener(evt, (e) => { els.txtColor.value = e.target.value; applyConfig(); });
                }
            });

            if(els.copyBtn && els.generatedLink) {
                els.copyBtn.addEventListener('click', () => {
                    els.generatedLink.select();
                    document.execCommand('copy');
                    const originalText = els.copyBtn.innerText;
                    els.copyBtn.innerText = '✓';
                    setTimeout(() => els.copyBtn.innerText = originalText, 1500);
                });
            }

            function loadConfigFromURL() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    if (Array.from(params.keys()).length === 0) return false;

                    if(els.inpText) els.inpText.value = params.get('txt') || 'Text';
                    if(els.inpDay) els.inpDay.value = params.get('day') || '2000-01-01';
                    
                    if(params.get('st') && els.szTxt && els.valTxt) { els.szTxt.value = params.get('st'); els.valTxt.value = params.get('st'); }
                    if(params.get('sd') && els.szDay && els.valDay) { els.szDay.value = params.get('sd'); els.valDay.value = params.get('sd'); }
                    if(params.get('sdd') && els.szDday && els.valDday) { els.szDday.value = params.get('sdd'); els.valDday.value = params.get('sdd'); }
                    
                    if(els.bgHex && els.bgColor) {
                        const bHex = '#' + (params.get('bc') || 'FFFFFF');
                        els.bgHex.value = bHex; els.bgColor.value = bHex.toLowerCase();
                    }
                    if(params.get('bo') && els.bgOp && els.valBgOp) { els.bgOp.value = params.get('bo'); els.valBgOp.value = params.get('bo'); }
                    
                    if(els.txtHex && els.txtColor) {
                        const tHex = '#' + (params.get('tc') || '000000');
                        els.txtHex.value = tHex; els.txtColor.value = tHex.toLowerCase();
                    }
                } catch(e) {}
            }

            setInterval(updateDdayCalc, 60000); 
            loadConfigFromURL();
            applyConfig();
            
        } catch(e) {
            console.error("Initialization Error:", e);
            // 치명적 에러 발생 시에도 빈 화면 방지를 위해 기본 위젯 표시 강제
            const widget = document.getElementById('widget-container');
            if(widget) widget.style.display = 'flex';
        }
    });
</script>
</body>
</html>
