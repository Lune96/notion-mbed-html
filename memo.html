<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Memo Widget</title>
<style>
    :root {
        /* S, M, L 비율 계수 */
        --scale-factor: 1; 
        /* 폰트, 여백, 아이콘 등 모든 크기를 조절하는 기준값 (안전한 반응형) */
        --base-font-size: calc(min(4vw, 16px) * var(--scale-factor));

        --primary-color: #6366f1;
        --bg-color: #ffffff; /* 위젯 본체 색상 */
        --memo-bg: #f3f4f6;
        --text-color: #1f2937;
        --border-color: #e5e7eb;
        --widget-shadow: 0 0.25em 1em rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 위젯 바깥쪽 배경은 무조건 투명하게 설정 */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex; justify-content: center; align-items: center;
        height: 100vh; width: 100vw;
        background-color: transparent !important;
        overflow: hidden;
        /* 최상위 폰트 사이즈 지정 (이하 모든 요소는 em으로 상대적 크기 가짐) */
        font-size: var(--base-font-size);
    }

    /* 노션 임베드 모드: 여백(padding)을 주어 위젯의 둥근 모서리가 안 잘리게 함 */
    body.embed-mode {
        --base-font-size: calc(4vw * var(--scale-factor)); /* 노션 폭 기준 100% 반응형 */
        padding: 1.5em; 
    }

    /* 위젯 본체 (둥근 네모 모양 유지) */
    .widget-container {
        width: 100%; max-width: 28em; height: 100%;
        background-color: var(--bg-color); 
        border-radius: 2em; /* 끝이 둥그런 네모 모양 */
        padding: 1.8em; display: flex; flex-direction: column;
        box-shadow: var(--widget-shadow); position: relative; overflow: hidden;
    }

    body.embed-mode .widget-container {
        max-width: none; /* 노션에서는 가로폭 제한 해제 */
    }

    .header { font-size: 1.75em; font-weight: 800; color: var(--text-color); margin-bottom: 1.2em; letter-spacing: -0.02em; word-break: break-all; }

    .input-section { margin-bottom: 1.2em; }
    .input-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 0.8em; }
    
    .input-wrapper input {
        width: 100%; padding: 1em 3.2em 1em 1.2em; border: none; border-radius: 6em;
        background-color: var(--memo-bg); font-size: 1em; outline: none; color: var(--text-color);
    }
    .input-wrapper input::placeholder { color: #9ca3af; }

    /* 아이콘들을 1px 오차 없이 완벽히 정중앙으로 맞추는 클래스 */
    .center-icon {
        display: flex; justify-content: center; align-items: center; 
        line-height: 0; padding: 0; margin: 0;
    }

    .add-btn {
        position: absolute; right: 0.5em; width: 2.2em; height: 2.2em; border-radius: 50%;
        background-color: var(--primary-color); color: white; border: none; 
        font-size: 1.2em; cursor: pointer; transition: transform 0.1s;
    }
    .add-btn:active { transform: scale(0.95); }

    /* 색상 버튼들 크기 비율 및 간격 축소 적용 */
    .color-picker { display: flex; gap: 0.4em; padding: 0 0.8em; }
    .color-circle {
        width: 0.85em; height: 0.85em; border-radius: 50%; cursor: pointer;
        border: max(1px, 0.08em) solid transparent; transition: transform 0.2s;
    }
    .color-circle.active { border: max(2px, 0.12em) solid #1f2937; transform: scale(1.15); }
    
    /* 색상 없음(none) 버튼: 회색 사선(대각선) 디자인 */
    .color-circle[data-color="none"] {
        background: linear-gradient(to top right, transparent 46%, #d1d5db 46%, #d1d5db 54%, transparent 54%), #ffffff;
        border: max(1px, 0.08em) solid #d1d5db;
    }
    .color-circle[data-color="none"].active { border: max(2px, 0.12em) solid #1f2937; }

    .memo-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6em; padding-bottom: 3em; padding-right: 0.3em; }
    .memo-list::-webkit-scrollbar { width: 0.4em; }
    .memo-list::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 0.2em; }
    .empty-state { margin: auto; color: #9ca3af; font-size: 1em; font-weight: 500; }

    /* 메모 아이템 (체크박스 위치 절대 고정) */
    .memo-item {
        display: flex; align-items: center; 
        /* 색상 띠가 있든 없든 왼쪽 패딩을 1.2em으로 고정하여 체크박스가 밀리지 않음 */
        padding: 0.8em 0.8em 0.8em 1.2em; 
        background-color: var(--memo-bg); border-radius: 1em; 
        position: relative; gap: 0.6em; overflow: hidden;
    }
    .memo-color-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0.4em; }

    .check-btn {
        width: 1.3em; height: 1.3em; border-radius: 50%; border: max(1px, 0.1em) solid #cbd5e1; background: transparent;
        cursor: pointer; flex-shrink: 0; color: white; font-size: 0.8em;
    }
    .check-btn.checked { background-color: #cbd5e1; border-color: #cbd5e1; }

    .memo-text { flex: 1; font-size: 0.95em; color: var(--text-color); line-height: 1.4; outline: none; word-break: break-word; }
    .memo-text.checked-text { text-decoration: line-through; opacity: 0.4; }

    .star-btn { background: transparent; border: none; font-size: 1.2em; cursor: pointer; color: #cbd5e1; width: 1.5em; height: 1.5em; }
    .star-btn.starred { color: #fbbf24; }

    .delete-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; font-size: 1.4em; width: 1.5em; height: 1.5em; }
    .delete-btn:hover { color: #ef4444; }

    .size-controls { 
        position: absolute; bottom: 1.5em; right: 1.5em; display: flex; gap: 0.4em; 
        background-color: var(--memo-bg); border-radius: 1em; padding: 0.3em; 
    }
    body.embed-mode .size-controls { box-shadow: 0 0.2em 0.5em rgba(0,0,0,0.05); }
    .size-btn {
        width: 1.8em; height: 1.8em; border-radius: 50%; border: max(1px, 0.1em) solid var(--border-color); background-color: white;
        color: #6b7280; font-size: 0.7em; font-weight: bold; cursor: pointer;
    }
    .size-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

    /* 모달 설정창 UI (설정창은 크기 변하지 않도록 px 고정) */
    #settings-btn { position: fixed; top: 15px; right: 15px; font-size: 22px; background: none; border: none; cursor: pointer; z-index: 100; }
    #settings-modal {
        display: none; position: fixed; top: 0; right: 0; width: 320px; height: 100vh;
        background-color: #ffffff; padding: 25px; box-shadow: -4px 0 15px rgba(0,0,0,0.1); z-index: 101; overflow-y: auto; color: #333;
    }
    .setting-group { margin-bottom: 20px; }
    .setting-label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; }
    .setting-input { width: 100%; height: 40px; border: none; cursor: pointer; padding: 0; }
    .setting-input-text { width: 100%; height: 38px; border: 1px solid #ddd; border-radius: 6px; padding: 0 10px; font-size: 14px; outline: none; font-family: inherit; }
    .setting-input-text:focus { border-color: #6366f1; }
    .checkbox-wrap { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; margin-bottom: 8px; }
    .close-btn { background: #111; color: #fff; border: none; padding: 10px; cursor: pointer; border-radius: 6px; width: 100%; font-weight: bold; margin-bottom: 20px; }
    .link-section { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
    .link-box { display: flex; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    #generated-link { flex: 1; border: none; padding: 10px; font-size: 11px; outline: none; background: #f9f9f9; }
    #copy-btn { background: #111; color: #fff; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<button id="settings-btn" title="설정">⚙️</button>

<div id="settings-modal">
    <button class="close-btn" id="close-settings">닫기</button>
    
    <div class="setting-group">
        <label class="setting-label">위젯 제목</label>
        <input type="text" class="setting-input-text" id="inp-title" value="MEMO" placeholder="MEMO">
    </div>

    <div class="setting-group">
