<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-Day Counter Widget</title>
<style>
    :root {
        --txt-size: 8vw;
        --day-size: 7vw;
        --dday-size: 24vw;
        --text-color: #000000;
        --day-color: #000000;
        --dday-color: #000000;
        --bg-color: rgba(255, 255, 255, 1);
    }

    body {
        margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: transparent;
        overflow: hidden;
    }

    #widget-container {
        flex: 1; display: flex; flex-direction: column; justify-content: space-between;
        padding: 5vw 6vw; box-sizing: border-box; background-color: var(--bg-color);
        transition: background-color 0.3s;
    }
    .top-section { display: flex; flex-direction: column; gap: 0.2vw; }
    
    #disp-text { font-size: var(--txt-size); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: var(--text-color); transition: color 0.3s; }
    #disp-day { font-size: var(--day-size); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; color: var(--day-color); transition: color 0.3s; }
    
    .bottom-section { display: flex; align-items: flex-end; justify-content: flex-start; flex: 1; padding-bottom: 2vw; }
    #disp-dday { font-size: var(--dday-size); font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; color: var(--dday-color); transition: color 0.3s; }

    #settings-btn { position: fixed; top: 20px; right: 20px; font-size: 24px; background: transparent; border: none; color: #888; cursor: pointer; z-index: 100; transition: color 0.3s; }
    #settings-btn:hover { color: #333; }
    
    #settings-modal {
        display: none; position: fixed; top: 0; right: 0; width: 380px; height: 100vh;
        background-color: #ffffff; color: #333; padding: 25px; box-sizing: border-box;
        box-shadow: -4px 0 15px rgba(0,0,0,0.1); z-index: 101; overflow-y: auto;
    }

    .setting-category { background-color: #f7f7f7; border: 1px solid #ececec; border-radius: 12px; padding: 18px 15px; margin-bottom: 20px; }
    .setting-category .setting-group { margin-bottom: 15px; }
    .setting-category .setting-group:last-child { margin-bottom: 0; }
    .setting-label { font-size: 13px; color: #333; margin-bottom: 8px; display: block; font-weight: 500; }
    
    .input-bar { background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    .input-bar input[type="color"] { border: none; background: transparent; width: 28px; height: 28px; padding: 0; cursor: pointer; border-radius: 4px; }
