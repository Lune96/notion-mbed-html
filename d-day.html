<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-Day Counter Widget</title>
<style>
    :root {
        --txt-size: 8vw;
        --day-size: 7vw;
        --dday-size: 24vw;
        --text-color: #000000;
        --bg-color: rgba(255, 255, 255, 1);
    }

    body {
        margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: transparent;
        overflow: hidden;
    }

    /* 위젯 레이아웃 */
    #widget-container {
        flex: 1; display: flex; flex-direction: column; justify-content: space-between;
        padding: 5vw 6vw; box-sizing: border-box; background-color: var(--bg-color);
        color: var(--text-color); transition: background-color 0.3s, color 0.3s;
    }
    .top-section { display: flex; flex-direction: column; gap: 0.2vw; }
    
    #disp-text { font-size: var(--txt-size); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    #disp-day { font-size: var(--day-size); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    
    .bottom-section { display: flex; align-items: flex-end; justify-content: flex-start; flex: 1; padding-bottom: 2vw; }
    #disp-dday { font-size: var(--dday-size); font-weight: 800; letter-spacing: -0.04em; line-height: 0.9; }

    /* 설정 UI */
    #settings-btn { position: fixed; top: 20px; right: 20px; font-size: 24px; background: transparent; border: none; color: #888; cursor: pointer; z-index: 100; transition: color 0.3s; }
    #settings-btn:hover { color: #333; }
    
    #settings-modal {
        display: none; position: fixed; top: 0; right: 0; width: 380px; height: 100vh;
        background-color: #ffffff; color: #333; padding: 25px; box-sizing: border-box;
        box-shadow: -4px 0 15px rgba(0,0,0,0.1); z-index: 101; overflow-y: auto;
    }

    /* 그룹화용 배경 박스 */
    .setting-category {
        background-color: #f7f7f7;
        border: 1px solid #ececec;
        border-radius: 12px;
        padding: 18px 15px;
        margin-bottom: 20px;
    }
    .setting-category .setting-group { margin-bottom: 15px; }
    .setting-category .setting-group:last-child { margin-bottom: 0; }

    .setting-label { font-size: 13px; color: #333; margin-bottom: 8px; display: block; font-weight: 500; }
    
    /* 바 형태의 입력창 스타일 */
    .input-bar {
        background-color: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 8px; padding: 12px 15px;
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .input-bar input[type="text"], .input-bar input[type="date"] {
        border: none; background: transparent; outline: none; font-size: 14px; color: #333; flex: 1; font-weight: 500;
    }
    .input-bar input[type="color"] {
        border: none; background: transparent; width: 28px; height: 28px; padding: 0; cursor: pointer; border-radius: 4px;
    }
    .input-bar input[type="range"] {
        flex: 1; accent-color: #555; height: 4px; border-radius: 2px; margin-right: 10px;
    }

    /* 개선된 직접 입력창 스타일 */
    .num-input-wrap { display: flex; align-items: center; justify-content: flex-end; width: 75px; }
    .num-input { 
        width: 45px; 
        background-color: #f4f4f4; /* 배경색 추가 */
        border: 1px solid #c0c0c0; /* 테두리 추가 */
        border-radius: 4px; 
        padding: 4px 6px; /* 여백 추가 */
        text-align: right; 
        font-size: 13px; color: #333; font-weight: 600; outline: none; font-family: inherit;
        -moz-appearance: textfield; 
        transition: border-color 0.2s, background-color 0.2s;
    }
    .num-input:focus {
        border-color: #888;
        background-color: #ffffff;
    }
    .num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
